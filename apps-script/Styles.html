<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ink: #1d1029;
    --muted: #6d5f80;
    --paper: #f7f4fa;
    --card: #ffffff;
    --line: #e4dcee;
    --purple: #4b1a7a;      /* the bill's border */
    --purple-2: #6b2fa0;
    --purple-soft: #efe8f7;
    --gold: #b98700;
    --gold-soft: #fdf0cc;
    --bad: #b42318;
    --bad-soft: #fde8e6;
    --good: #18794e;
    --good-soft: #e3f5ec;
    --present-bg: #ededed;   --present-ink: #4f4f4f;
    --personable-bg: #e2d9ef; --personable-ink: #4b1a7a;
    --productive-bg: #fdf0cc; --productive-ink: #946c00;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(29,16,41,.06), 0 6px 20px rgba(29,16,41,.06);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Geist', system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--purple-2); }
  .hand { font-family: 'Patrick Hand SC', 'Geist', cursive; letter-spacing: .02em; font-weight: 400; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 64px; }
  .wrap.wide { max-width: 1180px; }

  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .brand img { width: 84px; height: auto; flex: none; }
  .brand h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1; color: var(--purple); }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  .brand .spacer { flex: 1; }

  .card { background: var(--card); border: 3px solid var(--purple); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .card.soft { border: 1px solid var(--line); }
  .card h2 { margin: 0 0 14px; font-size: 1.6rem; line-height: 1.1; color: var(--purple); }
  .card h2 small { font-family: 'Geist', sans-serif; font-size: .85rem; color: var(--muted); letter-spacing: 0; margin-left: 8px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } .brand img { width: 64px; } }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field > label, .label { display: block; font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
  .hint { color: var(--muted); font-weight: 500; font-size: .85rem; }
  input[type=text], input[type=password], input[type=search], input[type=number], select, textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid #cdbfdd; border-radius: 10px; background: #fff; font-size: 1.05rem; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--purple-2); box-shadow: 0 0 0 3px rgba(107,47,160,.15); }
  .invalid { border-color: var(--bad) !important; box-shadow: 0 0 0 3px rgba(180,35,24,.12) !important; }
  .group-invalid { outline: 2px solid var(--bad); outline-offset: 4px; border-radius: 10px; }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    min-width: 56px; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #cdbfdd; background: #fff;
    font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: background .12s, border-color .12s, transform .08s;
  }
  .choice:hover { border-color: var(--purple-2); }
  .choice:active { transform: scale(.97); }
  .choice[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }
  .choices.teams { flex-wrap: nowrap; gap: 6px; }
  .choice.team { flex: 1 1 0; min-width: 0; padding: 10px 0; font-size: 1.35rem; font-family: 'Patrick Hand SC', sans-serif; }

  .squads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 600px) { .squads { grid-template-columns: repeat(2, 1fr); } }
  .squad {
    position: relative; padding: 16px 8px; border-radius: 12px; border: 3px solid transparent; cursor: pointer;
    color: #fff; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: .95rem;
    background: var(--sq); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); transition: transform .08s;
  }
  .squad[data-light="1"] { color: #1d1029; }
  .squad:active { transform: scale(.97); }
  .squad[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px #fff inset, 0 0 0 2px var(--ink); }
  .squad[aria-pressed="true"]::after { content: '✓'; position: absolute; top: 4px; right: 8px; font-size: 1rem; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 10px; border: 0; font-weight: 800; cursor: pointer; text-decoration: none; font-size: 1rem; }
  .btn.primary { background: var(--purple); color: #fff; }
  .btn.primary:hover { background: var(--purple-2); }
  .btn.gold { background: var(--gold); color: #fff; }
  .btn.ghost { background: transparent; border: 1.5px solid #cdbfdd; color: var(--purple); }
  .btn.ghost:hover { border-color: var(--purple-2); background: var(--purple-soft); }
  .btn.small { padding: 7px 12px; font-size: .85rem; border-radius: 8px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
  .msg { padding: 12px 14px; border-radius: 10px; font-weight: 600; }
  .msg.bad { background: var(--bad-soft); color: var(--bad); }
  .msg.good { background: var(--good-soft); color: var(--good); }
  .msg:empty { display: none; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .hidden { display: none !important; }
  .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<!-- Craft wiring for Trait Dough (the kit itself is between the craft markers below) -->
<style>
  html:root { --craft-accent: var(--purple); --craft-accent-2: var(--gold); }
  .btn { transition: background .2s, border-color .2s, color .2s, transform .2s, scale var(--craft-press-ms, .5s) var(--craft-spring, ease-out); }
  .btn:active:not(:disabled) { scale: var(--craft-squash, .97); transition-duration: .07s; }
  /* The drawing's wind-up: three bills shuffle (anticipation) before the winner pops out. */
  .td-shuffle { position: relative; width: 150px; height: 84px; margin: 22px auto 8px; }
  .td-shuffle span { position: absolute; inset: 0; border-radius: 10px; border: 3px solid var(--purple); background: var(--gold-soft);
    display: grid; place-items: center; font-size: 28px; box-shadow: 0 8px 20px -10px rgba(75, 26, 122, .5); animation: tdShuffle .5s ease-in-out infinite alternate; }
  .td-shuffle span:nth-child(2) { animation-delay: -.17s; } .td-shuffle span:nth-child(3) { animation-delay: -.34s; }
  @keyframes tdShuffle { from { transform: translateX(-26px) rotate(-8deg); } to { transform: translateX(26px) rotate(7deg); } }
  @media (prefers-reduced-motion: reduce) { .btn, .btn:active { transition: none; transform: none; scale: none; } .td-shuffle span { animation: none; } }
</style>
<!-- craft:start (copied from emsd/craft-kit/craft.html by craft-kit/sync.js; edit there, not here) -->
<style>
/* ── Craft: an ode to Pixar's craft, not its characters ───────────────────────────────────
   No characters, logos or famous shots. What's borrowed is how their films move and are lit:
   - squash and stretch, anticipation, follow-through and overshoot (the animation principles)
   - a warm key light, a cool rim light and dust floating in the light (cinematic lighting)
   - arcs: things that fly travel on curves, not straight lines
   Each tool keeps its own colors through --craft-accent / --craft-accent-2. Staff tools set
   <html data-craft="calm">, which keeps the same moves smaller and quicker (they're used all day).
   Everything here is off for people who ask for less motion. */
:root {
  --craft-accent: #9b5de5; --craft-accent-2: #ffe100;
  --craft-out: cubic-bezier(.22, 1, .36, 1);
  --craft-spring: cubic-bezier(.34, 1.56, .64, 1);
  --craft-squash: 1.06 .9; --craft-press-ms: .5s;
  --craft-key: rgba(255, 218, 160, .22); --craft-rim: rgba(140, 186, 255, .32);
}
@supports (transition-timing-function: linear(0, 1)) {
  /* A real spring: overshoots, comes back past rest, settles. */
  :root { --craft-spring: linear(0, .009, .035 2.1%, .141, .281 6.7%, .723 12.9%, .938 16.7%, 1.017, 1.077, 1.121, 1.149 24.3%, 1.159, 1.163, 1.161, 1.154 29.9%, 1.129 32.8%, 1.051 39.6%, 1.017 43.1%, .991, .977 51%, .974 53.8%, .975 57.1%, .997 69.8%, 1.003 76.9%, 1); }
}
html[data-craft="calm"] { --craft-squash: 1.02 .96; --craft-press-ms: .35s; }

/* Squash on press, spring back on release (buttons that do something). Craft uses the separate
   `scale` property, so it stacks with an element's own transform (centering, hover lifts). */
.craft-press { transition: scale var(--craft-press-ms) var(--craft-spring); }
.craft-press:active:not(:disabled) { scale: var(--craft-squash); transition: scale .07s ease-out; }

/* A success moment: anticipation (a tiny crouch), stretch up, squash, settle. */
.craft-pop { animation: craftPop .7s var(--craft-out) both; }
@keyframes craftPop {
  0% { scale: .7; opacity: 0; }
  30% { scale: 1.12 .88; opacity: 1; }
  50% { scale: .94 1.08; }
  70% { scale: 1.03 .98; }
  100% { scale: 1; }
}
html[data-craft="calm"] .craft-pop { animation-name: craftPopCalm; animation-duration: .45s; }
@keyframes craftPopCalm { 0% { scale: .94; opacity: 0; } 60% { scale: 1.02; opacity: 1; } 100% { scale: 1; } }

/* A number that just finished counting lands with a little bump. */
.craft-land { display: inline-block; animation: craftLand .5s var(--craft-out); }
@keyframes craftLand { 0% { scale: 1; } 35% { scale: 1.14 .9; } 65% { scale: .97 1.04; } 100% { scale: 1; } }

/* Cinematic light on a hero card: warm key light from the top left, cool rim along the bottom edge. */
.craft-lit { position: relative; isolation: isolate; }
.craft-lit::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: radial-gradient(80% 90% at 8% 0%, var(--craft-key), transparent 60%);
  box-shadow: inset 0 1px 0 rgba(255, 240, 215, .28), inset 0 -26px 46px -34px var(--craft-rim); }

/* Dust floating in the light. Slow, few, faint; on hero cards only. */
.craft-motes { position: relative; isolation: isolate; overflow: hidden; }
.craft-motes::after { content: ''; position: absolute; inset: -40% -15%; pointer-events: none; z-index: -1; opacity: .55;
  background-image:
    radial-gradient(2px 2px at 12% 28%, rgba(255, 236, 190, .9), transparent 70%), radial-gradient(1.5px 1.5px at 31% 66%, rgba(255, 236, 190, .7), transparent 70%),
    radial-gradient(2.5px 2.5px at 47% 18%, rgba(255, 236, 190, .6), transparent 70%), radial-gradient(1.5px 1.5px at 63% 52%, rgba(255, 236, 190, .8), transparent 70%),
    radial-gradient(2px 2px at 78% 34%, rgba(255, 236, 190, .7), transparent 70%), radial-gradient(1px 1px at 88% 74%, rgba(255, 236, 190, .9), transparent 70%),
    linear-gradient(112deg, transparent 32%, rgba(255, 222, 160, .07) 44%, transparent 58%);
  background-size: 420px 300px, 420px 300px, 420px 300px, 420px 300px, 420px 300px, 420px 300px, 100% 100%;
  animation: craftMotes 18s linear infinite alternate; }
@keyframes craftMotes { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(-36px, -70px, 0); } }

/* Celebration bits (craftCelebrate): flown on arcs by the script, then cleaned up. */
.craft-bit { position: fixed; left: 0; top: 0; width: 10px; height: 14px; border-radius: 3px; pointer-events: none; z-index: 2147483000; will-change: transform, opacity; }
.craft-bit.round { border-radius: 50%; width: 10px; height: 10px; }

/* Keyboard focus that's always visible. */
.craft-focus:focus-visible { outline: 2px solid var(--craft-accent-2); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {
  .craft-press, .craft-press:active { transition: none !important; scale: none !important; }
  .craft-pop, .craft-land, .craft-motes::after { animation: none !important; }
}
</style>
<script>
/* Craft helpers. craftPop(el): play the success pop again. craftLand(el): bump a number.
   craftCelebrate(el, colors): a short burst of bits flying on arcs from el (a vote counted,
   a reward earned). All three do nothing for people who ask for less motion. */
(function () {
  var reduce = function () { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; };
  var replay = function (el, cls) { if (!el || reduce()) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
  window.craftPop = function (el) { replay(el, 'craft-pop'); };
  window.craftLand = function (el) { replay(el, 'craft-land'); };
  window.craftCelebrate = function (el, colors) {
    if (!el || reduce() || !el.getBoundingClientRect || !document.body.animate) return;
    var calm = document.documentElement.getAttribute('data-craft') === 'calm';
    var r = el.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
    var css = getComputedStyle(document.documentElement);
    var pal = colors && colors.length ? colors : [css.getPropertyValue('--craft-accent').trim() || '#9b5de5', css.getPropertyValue('--craft-accent-2').trim() || '#ffe100', '#ffffff'];
    var n = calm ? 10 : 22;
    for (var i = 0; i < n; i++) {
      var b = document.createElement('span');
      b.className = 'craft-bit' + (i % 3 === 0 ? ' round' : '');
      b.style.background = pal[i % pal.length];
      document.body.appendChild(b);
      // An arc: up and out, then gravity pulls it down (slow in, slow out at the top).
      var ang = (-90 + (Math.random() - .5) * 150) * Math.PI / 180, v = (calm ? 90 : 150) + Math.random() * (calm ? 60 : 120);
      var dx = Math.cos(ang) * v, dy = Math.sin(ang) * v, fall = 160 + Math.random() * 140, spin = (Math.random() - .5) * 720;
      var frames = [], steps = 12;
      for (var s = 0; s <= steps; s++) {
        var t = s / steps, x = x0 + dx * t * 1.4, y = y0 + dy * t * 1.4 + fall * t * t;
        frames.push({ transform: 'translate(' + x + 'px,' + y + 'px) rotate(' + spin * t + 'deg) scale(' + (t < .15 ? .6 + t * 2.6 : 1) + ')', opacity: t > .75 ? (1 - t) * 4 : 1 });
      }
      b.animate(frames, { duration: (calm ? 700 : 1000) + Math.random() * 400, easing: 'linear', fill: 'forwards' }).onfinish = (function (node) { return function () { node.remove(); }; })(b);
    }
  };
})();
</script>
<!-- craft:end -->
