<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include('Styles') ?>
<?!= include('Logo') ?>
<style>
  .hero { display: grid; grid-template-columns: 180px 1fr; gap: 24px; align-items: center; margin-bottom: 22px; }
  .hero img { width: 100%; }
  .hero h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 3.2rem); color: var(--purple); line-height: 1; }
  .hero p { margin: 8px 0 0; font-size: 1.05rem; color: var(--muted); }
  @media (max-width: 600px) { .hero { grid-template-columns: 1fr; text-align: center; } .hero img { width: 140px; margin: 0 auto; } }
  .sec { background: #fff; border-left: 6px solid var(--purple); border-radius: 12px; padding: 16px 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .sec h2 { margin: 0 0 6px; font-size: 1.5rem; color: var(--purple); }
  .sec p { margin: 6px 0; }
  .sec ul, .sec ol { margin: 6px 0; padding-left: 22px; }
  .sec li { margin: 4px 0; }
  .sec:nth-of-type(3n+2) { border-left-color: var(--gold); }
  .sec:nth-of-type(3n) { border-left-color: #8a8a8a; }
  .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0 0 22px; }
  @media (max-width: 700px) { .pillars { grid-template-columns: 1fr; } }
  .pillar { border-radius: 12px; padding: 12px 14px; }
  .pillar h3 { margin: 0 0 4px; font-family: 'Patrick Hand SC', sans-serif; font-weight: 400; font-size: 1.4rem; }
  .pillar ul { margin: 0; padding-left: 18px; font-weight: 600; font-size: .95rem; }
  .pillar.Present { background: var(--present-bg); color: var(--present-ink); }
  .pillar.Personable { background: var(--personable-bg); color: var(--personable-ink); }
  .pillar.Productive { background: var(--productive-bg); color: var(--productive-ink); }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <img id="logo" alt="Clash of Classes 2026-27 squads shield">
    <div>
      <h1 class="hand" id="title">Trait Dough</h1>
      <p id="sub"></p>
    </div>
  </div>
  <div class="pillars" id="pillars"></div>
  <div id="sections"></div>
  <div class="links" id="links"></div>
</div>
<script>
  const CFG = <?!= publicConfigJs_() ?>;
  const BASE = <?!= JSON.stringify(baseUrl || '') ?>;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  $('logo').src = CFG.logoUrl || window.TD_LOGO;
  $('title').textContent = CFG.title;
  $('sub').textContent = 'How it works' + (CFG.school ? ' · ' + CFG.school : '') + ' · Present, Personable, Productive';
  document.title = CFG.title + ' · How it works';

  const groups = {};
  CFG.traits.forEach(t => { (groups[t.pillar || 'Other'] = groups[t.pillar || 'Other'] || []).push(t.trait); });
  $('pillars').innerHTML = Object.keys(groups).map(p =>
    '<div class="pillar ' + esc(p) + '"><h3>' + esc(p) + '</h3><ul>' + groups[p].map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>').join('');

  // Info tab: lines starting with "- " become bullets; other lines are paragraphs.
  function body(text) {
    const lines = String(text).split(/\r?\n/);
    let html = '', list = false;
    lines.forEach(line => {
      const m = /^\s*[-•]\s+(.*)$/.exec(line);
      if (m) { if (!list) { html += '<ul>'; list = true; } html += '<li>' + esc(m[1]) + '</li>'; return; }
      if (list) { html += '</ul>'; list = false; }
      if (line.trim()) html += '<p>' + esc(line) + '</p>';
    });
    return html + (list ? '</ul>' : '');
  }
  $('sections').innerHTML = CFG.info.map(s => '<section class="sec">' + (s.section ? '<h2 class="hand">' + esc(s.section) + '</h2>' : '') + body(s.content) + '</section>').join('');

  const links = [];
  if (CFG.templateUrl) links.push(['Printable Trait Dough (digital copy)', CFG.templateUrl, 'primary']);
  if (CFG.guidelinesUrl) links.push(['Full guidelines doc', CFG.guidelinesUrl, 'ghost']);
  links.push(['Turn-in page', BASE || '?', 'ghost']);
  links.push(['Staff dashboard', (BASE || '') + '?view=admin', 'ghost']);
  $('links').innerHTML = links.map(l => '<a class="btn ' + l[2] + '" target="_blank" href="' + esc(l[1]) + '">' + esc(l[0]) + '</a>').join('');
</script>
</body>
</html>
