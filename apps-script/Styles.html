<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Patrick+Hand+SC&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --ink: #1d1029;
    --muted: #6d5f80;
    --paper: #f7f4fa;
    --card: #ffffff;
    --line: #e4dcee;
    --purple: #4b1a7a;      /* the bill's border */
    --purple-2: #6b2fa0;
    --purple-soft: #efe8f7;
    --gold: #b98700;
    --gold-soft: #fdf0cc;
    --bad: #b42318;
    --bad-soft: #fde8e6;
    --good: #18794e;
    --good-soft: #e3f5ec;
    --present-bg: #ededed;   --present-ink: #4f4f4f;
    --personable-bg: #e2d9ef; --personable-ink: #4b1a7a;
    --productive-bg: #fdf0cc; --productive-ink: #946c00;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(29,16,41,.06), 0 6px 20px rgba(29,16,41,.06);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Geist', system-ui, -apple-system, sans-serif; font-size: 16px; line-height: 1.45; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--purple-2); }
  .hand { font-family: 'Patrick Hand SC', 'Geist', cursive; letter-spacing: .02em; font-weight: 400; }

  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 64px; }
  .wrap.wide { max-width: 1180px; }

  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .brand img { width: 84px; height: auto; flex: none; }
  .brand h1 { margin: 0; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1; color: var(--purple); }
  .brand p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  .brand .spacer { flex: 1; }

  .card { background: var(--card); border: 3px solid var(--purple); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow); }
  .card.soft { border: 1px solid var(--line); }
  .card h2 { margin: 0 0 14px; font-size: 1.6rem; line-height: 1.1; color: var(--purple); }
  .card h2 small { font-family: 'Geist', sans-serif; font-size: .85rem; color: var(--muted); letter-spacing: 0; margin-left: 8px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) { .grid2 { grid-template-columns: 1fr; } .brand img { width: 64px; } }

  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field > label, .label { display: block; font-weight: 700; font-size: .95rem; margin-bottom: 6px; }
  .hint { color: var(--muted); font-weight: 500; font-size: .85rem; }
  input[type=text], input[type=password], input[type=search], input[type=number], select, textarea {
    width: 100%; padding: 12px 14px; border: 1.5px solid #cdbfdd; border-radius: 10px; background: #fff; font-size: 1.05rem; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--purple-2); box-shadow: 0 0 0 3px rgba(107,47,160,.15); }
  .invalid { border-color: var(--bad) !important; box-shadow: 0 0 0 3px rgba(180,35,24,.12) !important; }
  .group-invalid { outline: 2px solid var(--bad); outline-offset: 4px; border-radius: 10px; }

  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice {
    min-width: 56px; padding: 12px 16px; border-radius: 10px; border: 1.5px solid #cdbfdd; background: #fff;
    font-weight: 700; font-size: 1.05rem; cursor: pointer; transition: background .12s, border-color .12s, transform .08s;
  }
  .choice:hover { border-color: var(--purple-2); }
  .choice:active { transform: scale(.97); }
  .choice[aria-pressed="true"] { background: var(--purple); border-color: var(--purple); color: #fff; }
  .choices.teams { flex-wrap: nowrap; gap: 6px; }
  .choice.team { flex: 1 1 0; min-width: 0; padding: 10px 0; font-size: 1.35rem; font-family: 'Patrick Hand SC', sans-serif; }

  .squads { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 600px) { .squads { grid-template-columns: repeat(2, 1fr); } }
  .squad {
    position: relative; padding: 16px 8px; border-radius: 12px; border: 3px solid transparent; cursor: pointer;
    color: #fff; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; font-size: .95rem;
    background: var(--sq); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); transition: transform .08s;
  }
  .squad[data-light="1"] { color: #1d1029; }
  .squad:active { transform: scale(.97); }
  .squad[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 3px #fff inset, 0 0 0 2px var(--ink); }
  .squad[aria-pressed="true"]::after { content: '✓'; position: absolute; top: 4px; right: 8px; font-size: 1rem; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 18px; border-radius: 10px; border: 0; font-weight: 800; cursor: pointer; text-decoration: none; font-size: 1rem; }
  .btn.primary { background: var(--purple); color: #fff; }
  .btn.primary:hover { background: var(--purple-2); }
  .btn.gold { background: var(--gold); color: #fff; }
  .btn.ghost { background: transparent; border: 1.5px solid #cdbfdd; color: var(--purple); }
  .btn.ghost:hover { border-color: var(--purple-2); background: var(--purple-soft); }
  .btn.small { padding: 7px 12px; font-size: .85rem; border-radius: 8px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 800; letter-spacing: .04em; white-space: nowrap; }
  .msg { padding: 12px 14px; border-radius: 10px; font-weight: 600; }
  .msg.bad { background: var(--bad-soft); color: var(--bad); }
  .msg.good { background: var(--good-soft); color: var(--good); }
  .msg:empty { display: none; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .hidden { display: none !important; }
  .spinner { width: 18px; height: 18px; border: 3px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
